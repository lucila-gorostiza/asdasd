&lt;style&gt;
  /* ============================================================
     EL PARTE — sistema de diseño &quot;Riso&quot; (typeui.sh pull riso)
     primary #F237A1 · secondary #2C40A7 · text #111827
     Space Grotesk / Overpass Mono · escala 4/8/12/16/24/32
     ============================================================ */

  :root{
    --pink:#F237A1;
    --blue:#2C40A7;
    --green:#16A34A;
    --amber:#D97706;
    --red:#DC2626;
    --ink:#111827;
    --paper:#FBF7F0;
    --surface:#FFFFFF;
    --muted:#5B6474;
    --line:rgba(17,24,39,.14);

    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r-sm:4px; --r-md:8px;

    --sans:&quot;Space Grotesk&quot;,&quot;Space Grotesk Variable&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;
    --mono:&quot;Overpass Mono&quot;,&quot;Roboto Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:clip}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(44,64,167,.09) 1px, transparent 0);
    background-size:7px 7px;
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    font-weight:400;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 var(--s4) var(--s6)}

  /* ---------- etiquetas mono ---------- */
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

  /* ---------- cabecera ---------- */
  header.masthead{
    background:var(--blue);
    color:#fff;
    border-bottom:4px solid var(--pink);
    padding:var(--s5) 0 var(--s4);
    margin-bottom:var(--s5);
    background-image:radial-gradient(circle at 1px 1px, rgba(242,55,161,.5) 1px, transparent 0);
    background-size:8px 8px;
  }
  .masthead .wrap{padding-bottom:0}
  .brandrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
  h1.logo{
    font-size:clamp(44px,11vw,88px);
    line-height:.86;
    margin:0;
    font-weight:900;
    letter-spacing:-.035em;
    color:#fff;
    text-shadow:3px 3px 0 var(--pink);
  }
  .tagline{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.9);
    margin-top:var(--s2);
    max-width:34ch;
  }
  .dateblock{
    font-family:var(--mono);
    font-size:12px;
    line-height:1.7;
    text-align:right;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:rgba(255,255,255,.95);
    border-left:3px solid var(--pink);
    padding-left:var(--s3);
  }
  .dateblock strong{display:block;font-size:14px;color:#fff}

  /* ---------- portada / resumen ---------- */
  .lede{
    background:var(--surface);
    border:2px solid var(--ink);
    border-radius:var(--r-md);
    box-shadow:5px 5px 0 var(--pink);
    padding:var(--s5);
    margin-bottom:var(--s6);
  }
  .lede h2{
    font-size:13px;
    font-family:var(--mono);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--blue);
    margin:0 0 var(--s3);
  }
  ol.index{margin:0;padding-left:var(--s5)}
  ol.index li{margin-bottom:var(--s2);font-size:17px;font-weight:500;line-height:1.45}
  ol.index li::marker{color:var(--pink);font-weight:700;font-family:var(--mono)}
  ol.index li:last-child{margin-bottom:0}

  /* ---------- secciones ---------- */
  section{margin-bottom:var(--s6)}
  .sechead{
    display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);
    background:var(--ink);color:#fff;
    border-radius:var(--r-sm);
    padding:var(--s2) var(--s3);
    margin-bottom:var(--s4);
    position:sticky;top:0;z-index:5;
  }
  .secnum{
    font-family:var(--mono);font-size:14px;font-weight:700;
    background:var(--pink);color:#fff;
    border-radius:var(--r-sm);
    padding:2px 8px;
  }
  .sechead h2{
    margin:0;font-size:16px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    font-family:var(--mono);
  }
  .sechead .secmeta{
    margin-left:auto;font-family:var(--mono);font-size:11px;
    color:rgba(255,255,255,.65);letter-spacing:.1em;text-transform:uppercase;
    min-width:0;overflow-wrap:anywhere;
  }

  /* ---------- notas ---------- */
  article.item{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:5px solid var(--blue);
    border-radius:var(--r-md);
    padding:var(--s4) var(--s5);
    margin-bottom:var(--s4);
  }
  article.item.lead{border-left-color:var(--pink);box-shadow:4px 4px 0 rgba(44,64,167,.16)}
  .kicker{
    font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--pink);
    display:block;margin-bottom:var(--s1);
  }
  article.item h3{
    margin:0 0 var(--s3);
    font-size:clamp(21px,3.1vw,27px);
    line-height:1.22;
    font-weight:700;
    letter-spacing:-.02em;
  }
  article.item p{margin:0 0 var(--s3);color:#1F2937}
  article.item p:last-child{margin-bottom:0}
  article.item a{color:var(--blue);text-underline-offset:2px}

  /* ---------- chips de estado ---------- */
  .chip{
    display:inline-block;
    font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;
    border-radius:var(--r-sm);
    padding:3px 8px;
    margin:0 var(--s1) var(--s3) 0;
    border:1px solid currentColor;
  }
  .chip.blue{color:var(--blue);background:rgba(44,64,167,.10)}
  .chip.pink{color:var(--pink);background:rgba(242,55,161,.10)}
  .chip.green{color:#0F7A36;background:rgba(22,163,74,.12)}
  .chip.amber{color:#9A5700;background:rgba(217,119,6,.14)}
  .chip.red{color:var(--red);background:rgba(220,38,38,.10)}
  .chip.grey{color:var(--muted);background:rgba(17,24,39,.06)}

  /* ---------- por qué importa ---------- */
  .why{
    border-left:4px solid var(--pink);
    background:rgba(242,55,161,.055);
    border-radius:0 var(--r-sm) var(--r-sm) 0;
    padding:var(--s3) var(--s4);
    margin-top:var(--s4);
  }
  .why span{
    display:block;
    font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--pink);
    margin-bottom:var(--s1);
  }
  .why p{margin:0;font-size:15px;line-height:1.55}

  /* ---------- líneas de &quot;sin novedad&quot; ---------- */
  .brief{
    display:flex;gap:var(--s3);align-items:flex-start;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--r-sm);
    padding:var(--s3) var(--s4);
    margin-bottom:var(--s2);
    font-size:15px;
  }
  .brief b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);white-space:nowrap;padding-top:3px;min-width:96px}
  .brief p{margin:0;color:#374151}

  /* ---------- tabla F1 ---------- */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:var(--s4)}
  table{border-collapse:collapse;width:100%;min-width:460px;font-size:15px}
  caption{
    text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);padding:var(--s3) var(--s4) var(--s2);
  }
  th,td{padding:var(--s2) var(--s4);text-align:left;border-bottom:1px solid var(--line)}
  thead th{
    background:var(--blue);color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;
  }
  tbody tr:last-child td{border-bottom:none}
  td.pos{font-family:var(--mono);color:var(--pink);font-weight:700;width:40px}
  td.pts{font-family:var(--mono);font-weight:700;text-align:right}
  tr.hl td{background:rgba(242,55,161,.07)}
  tr.hl td.driver{font-weight:700}

  /* ---------- semáforo transporte ---------- */
  .lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
  .line{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:5px solid var(--green);
    border-radius:var(--r-md);
    padding:var(--s3) var(--s4);
  }
  .line.watch{border-top-color:var(--amber)}
  .line.alert{border-top-color:var(--red)}
  .line .num{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
  .line .st{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0F7A36}
  .line.watch .st{color:#9A5700}
  .line.alert .st{color:var(--red)}
  .line p{margin:var(--s1) 0 0;font-size:14px;color:var(--muted);line-height:1.45}

  /* ---------- pie ---------- */
  footer{
    border-top:4px solid var(--pink);
    background:var(--ink);
    color:#E5E7EB;
    padding:var(--s5) 0 var(--s6);

    border-radius:var(--r-sm);

    border-left:4px solid var(--pink);

  }
  .colofon{
    margin-top:var(--s5);padding-top:var(--s4);
    border-top:1px solid rgba(229,231,235,.2);

  }

  }

&lt;body&gt;

&lt;header class=&quot;masthead&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;brandrow&quot;&gt;
      &lt;div&gt;
        &lt;h1 class=&quot;logo&quot;&gt;EL PARTE&lt;/h1&gt;
        &lt;p class=&quot;tagline&quot;&gt;Diario político-informativo · Belgrano &amp;amp; Núñez, CABA&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dateblock&quot;&gt;
        &lt;strong&gt;Jueves 15 de octubre de 2026&lt;/strong&gt;
        Cierre de edición 00:25 · Hora de Argentina (ART)&lt;br&gt;
        6 secciones
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;div class=&quot;lede&quot;&gt;
    &lt;h2&gt;Lo que ordena el día&lt;/h2&gt;
    &lt;ol class=&quot;index&quot;&gt;
      &lt;li&gt;Marcha Federal Universitaria frente al Congreso, con la CGT, las CTA y ATE, y sesión opositora en Diputados por el DNU 70 y la emergencia en discapacidad con el quórum en duda.&lt;/li&gt;
      &lt;li&gt;Milei viajó a Washington, ratificó su alineamiento con Trump y respaldó a Flávio Bolsonaro de cara al balotaje del 25/10 en Brasil.&lt;/li&gt;
      &lt;li&gt;Sin paros de colectivos de hoy relevados, con las líneas 130 y 67 normales; Colapinto abandonó en Singapur y la próxima cita es Austin.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;

  &lt;!-- ============ 1. NACIONAL ============ --&gt;
  &lt;section id=&quot;nacional&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;01&lt;/span&gt;
      &lt;h2&gt;Nacional&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Congreso · Universidades · Interna&lt;/span&gt;
    &lt;/div&gt;

    &lt;article class=&quot;item lead&quot;&gt;
      &lt;span class=&quot;kicker&quot;&gt;Congreso · Calle&lt;/span&gt;
      &lt;h3&gt;Marcha universitaria y sesión opositora en Diputados: el reclamo por fondos y discapacidad llega hoy al Congreso&lt;/h3&gt;
      &lt;span class=&quot;chip pink&quot;&gt;Novedad&lt;/span&gt;
      &lt;span class=&quot;chip amber&quot;&gt;Quórum en duda&lt;/span&gt;
      &lt;p&gt;Según los medios consultados, la quinta Marcha Federal Universitaria coincide hoy con una protesta de la CGT, las dos CTA, ATE y movimientos sociales, que reclaman por el financiamiento universitario, la emergencia en discapacidad y la derogación del DNU 70/2023. En paralelo, bloques opositores convocaron una sesión especial a las 14 para tratar el DNU 70, la prórroga de la emergencia en discapacidad y proyectos sobre endeudamiento familiar; los dos últimos ya tienen dictamen. Los espacios firmantes suman 122 legisladores, siete menos que los 129 del quórum, y la atención está puesta en Provincias Unidas y los gobernadores de Córdoba y Santa Fe. El oficialismo dice confiar en sus aliados. Al cierre de esta edición no pudimos confirmar el resultado de la sesión ni la convocatoria a la marcha.&lt;/p&gt;
      &lt;div class=&quot;why&quot;&gt;
        &lt;span&gt;Por qué importa&lt;/span&gt;
        &lt;p&gt;La discapacidad es el principal foco de tensión del Presupuesto 2027, cuyo dictamen el oficialismo apunta a fijar para el 28/10: lo que pase hoy marca el clima de esa negociación.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/article&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Oficialismo&lt;/b&gt;
      &lt;p&gt;Según Infobae, de cara a 2027 las principales figuras del Gobierno se reprochan la falta de resultados y crece el estrés por los frentes abiertos (reforma política y Presupuesto); tras rumores de salida, Milei reafirmó que Luis Caputo sigue en Economía.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Presupuesto 2027&lt;/b&gt;
      &lt;p&gt;Sin cambios respecto de ayer: dictamen previsto el 28/10 y votación en el recinto el 18/11, con reuniones informativas el 20 y el 27.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Mercado&lt;/b&gt;
      &lt;p&gt;No pudimos verificar cotizaciones de hoy; lo último confirmado es el dólar oficial a $1.540 y un riesgo país cercano a 590 puntos (jueves 8), y otras notas sin fecha clara hablan de un riesgo país por encima de 640.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ 2. INTERNACIONAL ============ --&gt;
  &lt;section id=&quot;internacional&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;02&lt;/span&gt;
      &lt;h2&gt;Internacional&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Brasil · Estados Unidos&lt;/span&gt;
    &lt;/div&gt;

    &lt;article class=&quot;item lead&quot;&gt;
      &lt;span class=&quot;kicker&quot;&gt;Internacional · Brasil · EE.UU.&lt;/span&gt;
      &lt;h3&gt;Milei, en Washington, ratificó su alineamiento con Trump y apoyó a Flávio Bolsonaro rumbo al balotaje&lt;/h3&gt;
      &lt;span class=&quot;chip pink&quot;&gt;Novedad&lt;/span&gt;
      &lt;span class=&quot;chip blue&quot;&gt;En curso&lt;/span&gt;
      &lt;p&gt;Según Infobae y Diario Neuquino, en su viaje número 20 a Estados Unidos Milei reivindicó la gestión de Trump, condenó la ola mundial de antisemitismo, tildó a Lula de comunista y pidió &quot;defender el legado de occidente&quot;; regresa hoy a Buenos Aires. El balotaje brasileño es el 25 de octubre y las encuestas muestran una disputa reñida con resultados dispares según la encuestadora (Datafolha, Quaest y AtlasIntel difieren en quién lidera, en general dentro del margen de error).&lt;/p&gt;
      &lt;div class=&quot;why&quot;&gt;
        &lt;span&gt;Por qué importa&lt;/span&gt;
        &lt;p&gt;Brasil es el principal socio comercial de Argentina: un pronunciamiento presidencial a favor de un candidato puede condicionar la relación bilateral y el Mercosur según quién gane.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/article&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Irán · EE.UU.&lt;/b&gt;
      &lt;p&gt;Sin novedades verificadas hoy; lo último que relevamos es el reclamo iraní de que Washington cumpla el memorando de Islamabad.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Ucrania · Gaza&lt;/b&gt;
      &lt;p&gt;Sin novedades verificadas hoy.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ 3. F1 ============ --&gt;
  &lt;section id=&quot;f1&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;03&lt;/span&gt;
      &lt;h2&gt;Deporte · Fórmula 1&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Singapur · Ferrari · Colapinto&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Colapinto · Alpine&lt;/b&gt;
      &lt;p&gt;Sin novedades hoy. Abandonó en la vuelta 31 del GP de Singapur por un problema de su Alpine, acumula tres fechas sin puntos y sigue 12° con 27, según la cobertura consultada. La próxima cita es el GP de Estados Unidos en Austin, fin de semana del 25/10 (fecha no cotejada con el calendario oficial).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Campeonato&lt;/b&gt;
      &lt;p&gt;Kimi Antonelli lidera con 340 puntos y más de 100 de ventaja sobre George Russell; Max Verstappen subió al cuarto puesto tras ganar en Marina Bay. Falta el resto del corte.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Aclaración&lt;/b&gt;
      &lt;p&gt;Retiramos las tablas de ayer: eran un corte previo a Singapur (Antonelli figuraba con 320) y hoy no encontramos una tabla completa y actualizada de pilotos ni de constructores, ni los puntos actuales de Hamilton, Leclerc y la Scuderia Ferrari. No publicamos cifras que no podemos conciliar.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ 4. MÚSICA ============ --&gt;
  &lt;section id=&quot;musica&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;04&lt;/span&gt;
      &lt;h2&gt;Música&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Agenda&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Agenda&lt;/b&gt;
      &lt;p&gt;Sin lanzamientos ni shows destacados verificados para hoy. Siguen en agenda Los Pericos en el Gran Rex el 22/10 y David Bisbal en Rosario el 18/10.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ 5. MI BARRIO ============ --&gt;
  &lt;section id=&quot;barrio&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;05&lt;/span&gt;
      &lt;h2&gt;Mi Barrio · Belgrano / Núñez&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Monumental&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;brief&quot;&gt;
      &lt;b&gt;Monumental&lt;/b&gt;
      &lt;p&gt;Sin partido ni recital verificados hoy. El próximo partido de local de River sería ante Racing el domingo 25/10 (dato de un portal que no pudimos cotejar con el fixture oficial); en agenda del estadio, Maná el 10/12.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ============ 6. SERVICIOS ============ --&gt;
  &lt;section id=&quot;servicios&quot;&gt;
    &lt;div class=&quot;sechead&quot;&gt;
      &lt;span class=&quot;secnum&quot;&gt;06&lt;/span&gt;
      &lt;h2&gt;Servicios · Transporte&lt;/h2&gt;
      &lt;span class=&quot;secmeta&quot;&gt;Colectivos CABA · Líneas 130 y 67&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;lines&quot;&gt;
      &lt;div class=&quot;line&quot;&gt;
        &lt;div class=&quot;num&quot;&gt;130&lt;/div&gt;
        &lt;div class=&quot;st&quot;&gt;● Normal&lt;/div&gt;
        &lt;p&gt;Sin paro ni demoras de hoy en las fuentes consultadas; sin evento en el Monumental.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;line&quot;&gt;
        &lt;div class=&quot;num&quot;&gt;67&lt;/div&gt;
        &lt;div class=&quot;st&quot;&gt;● Normal&lt;/div&gt;
        &lt;p&gt;Sin paro ni demoras de hoy en las fuentes consultadas; sin evento en el Monumental.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;line&quot;&gt;
        &lt;div class=&quot;num&quot;&gt;AMBA&lt;/div&gt;
        &lt;div class=&quot;st&quot;&gt;● Normal&lt;/div&gt;
        &lt;p&gt;Sin paro de colectivos de hoy entre las fuentes consultadas; las notas de paro halladas son de otras fechas y no cuentan.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;/div&gt;

    &lt;h2&gt;Sobre el equilibrio de esta edición&lt;/h2&gt;
    &lt;div class=&quot;balance&quot;&gt;
      &lt;p&gt;&lt;strong&gt;El Parte&lt;/strong&gt; informa hechos y expone distintas miradas sobre ellos. No emite opinión editorial: cuando aparecen valoraciones, están atribuidas a quienes las formulan —gobierno, oposición, gremios, organismos internacionales o medios— y se presentan las posiciones en disputa, incluso cuando son incompatibles entre sí.&lt;/p&gt;
      &lt;p&gt;La sección &quot;Por qué importa&quot; es análisis de contexto e implicancias, no una recomendación ni una toma de posición. Los temas sin novedades del día se resumen en una línea o se marcan como tales: no se rellena la edición.&lt;/p&gt;
      &lt;p&gt;Los valores de dólar y riesgo país mencionados son los últimos verificados y pueden haber variado.&lt;/p&gt;
      &lt;p&gt;Sobre Ucrania, los balances de cada parte no pudieron verificarse de forma independiente.&lt;/p&gt;
      &lt;p&gt;Los resultados de la sesión de Diputados y de la marcha de hoy no estaban confirmados al cierre.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;colofon&quot;&gt;
