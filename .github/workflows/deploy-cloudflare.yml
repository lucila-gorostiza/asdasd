# Publica El Parte en Cloudflare Pages (proyecto "el-parte").
#
# Corre sola en cada push a main que toque index.html: el fast-forward a main
# que hace la rutina diaria (CLAUDE.md §11) ES el deploy. También se puede
# lanzar a mano desde la pestaña Actions ("Run workflow").
#
# Se publica index.html más los archivos del ícono en logo/ (favicon.ico, ícono
# de celular y manifest); el <head> los referencia como logo/... (CLAUDE.md
# §6.0). Ojo: el sitio que ve la dueña es el Worker "asdasd", no este Pages. plantilla.html, cuerpo.html, armar.py y los .md
# quedan fuera del sitio.
#
# Requiere dos secrets del repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta de Cloudflare
name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - logo/**
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

# Si entran dos pushes seguidos, gana el último: nunca se publica una edición
# vieja encima de una nueva.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROYECTO: el-parte
    steps:
      - uses: actions/checkout@v4

      # Mismas validaciones que armar.py, sobre el index.html commiteado y sin
      # reescribirlo. Si fallan, no se publica.
      - name: Validar index.html
        run: python3 armar.py --validar

      - name: Preparar el sitio (index.html + ícono)
        run: |
          mkdir -p sitio/logo
          cp index.html sitio/index.html
          cp logo/favicon.ico logo/icon.svg logo/apple-touch-icon.png \
             logo/icon-192.png logo/icon-512.png logo/icon-maskable-512.png \
             logo/site.webmanifest sitio/logo/
          cp logo/favicon.ico sitio/favicon.ico

      # Crea el proyecto la primera vez; en las siguientes ya existe y este
      # paso falla sin consecuencias. Si el problema es el token, el deploy de
      # abajo falla con el error real.
      - name: Asegurar el proyecto de Pages
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROYECTO }} --production-branch=main

      - name: Publicar en producción
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sitio --project-name=${{ env.PROYECTO }} --branch=main --commit-dirty=true

      - name: Resumen
        run: |
          {
            echo "### El Parte publicado en Cloudflare Pages"
            echo ""
            echo "- Deploy: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Producción: https://${PROYECTO}.pages.dev"
            echo "- Edición: $(grep -o '<title>[^<]*' index.html | sed 's/<title>//')"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
